[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jove-bridge"
version = "2.0.0"
description = "stdio JSON-lines Jupyter kernel bridge sidecar for jove.nvim"
requires-python = ">=3.10"
dependencies = [
    "jupyter_client>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ipykernel>=6",
    "jupytext>=1.16",
    "ruff==0.16.7",
]

[tool.setuptools]
packages = ["jove_bridge"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["jove_bridge"]
