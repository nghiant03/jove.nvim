name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.1.0
          args: --check .

  selene:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install selene
        run: |
          curl -sL -o selene.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip selene.zip
          chmod +x selene
      - name: Lint
        run: ./selene .

  test:
    name: test (nvim ${{ matrix.nvim }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.11.4, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jupytext
        run: pip install jupytext

      - name: Fetch mini.test
        run: |
          mkdir -p .testdeps
          git clone --depth 1 https://github.com/nvim-mini/mini.test .testdeps/mini.test

      - name: Run tests
        run: bash scripts/run_tests.sh

  bridge:
    name: bridge (pytest, py${{ matrix.python }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install bridge with dev extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ipykernel --version

      - name: Ensure python3 kernelspec is registered
        working-directory: python
        run: python -m ipykernel install --user --name python3 --display-name "Python 3 (ipykernel)" || true

      - name: Run bridge conformance tests
        working-directory: python
        run: python -m pytest -q
