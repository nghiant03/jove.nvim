name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.1.0
          args: --check .

  selene:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install selene
        run: |
          curl -sL -o selene.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip selene.zip
          chmod +x selene
      - name: Lint
        run: ./selene .

  test:
    name: test (nvim ${{ matrix.nvim }} on ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.11.4, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.14"

      - name: Install jupytext + bridge deps
        # jupyter_client/ipykernel enable the real-sidecar e2e spec
        # (bridge_e2e_spec.lua) which self-skips without them.
        run: uv sync --project python --locked --extra dev --python 3.12

      - name: Fetch mini.test
        run: |
          mkdir -p .testdeps
          git init .testdeps/mini.test
          git -C .testdeps/mini.test fetch --depth 1 https://github.com/nvim-mini/mini.test 3cc4c29be99531b3fc4fb99f3fa964b492166728
          git -C .testdeps/mini.test checkout --detach FETCH_HEAD

      - name: Run tests
        run: uv run --project python --locked --extra dev bash scripts/run_tests.sh

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.14"
      - run: uv run --project python --locked --extra dev ruff check python
      - run: uv run --project python --locked --extra dev ruff format --check python

  bridge:
    name: bridge (pytest, py${{ matrix.python }} on ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.14"

      - name: Install bridge with dev extras
        working-directory: python
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python }}
          uv run --locked --extra dev python -m ipykernel --version

      - name: Ensure python3 kernelspec is registered
        working-directory: python
        run: uv run --locked --extra dev python -m ipykernel install --user --name python3 --display-name "Python 3 (ipykernel)"

      - name: Run bridge conformance tests
        working-directory: python
        run: uv run --locked --extra dev python -m pytest -q
