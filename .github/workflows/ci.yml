name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.14"
  MINI_TEST_SHA: "3cc4c29be99531b3fc4fb99f3fa964b492166728"
  SELENE_SHA256: "dac452422747999ec4919bbb8bb52992b66aae533b60022bf005669de8616671"
  LUALS_SHA256: "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8"

jobs:
  stylua:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.1.0
          args: --check .

  selene:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install selene
        run: |
          curl -sL -o selene.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          echo "$SELENE_SHA256  selene.zip" | sha256sum --check -
          unzip -o selene.zip
          chmod +x selene
      - name: Lint
        run: ./selene .

  luals:
    name: lua-language-server --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install lua-language-server
        run: |
          curl -sL -o "$RUNNER_TEMP/luals.tar.gz" \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "$LUALS_SHA256  $RUNNER_TEMP/luals.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
      - name: Type-check
        run: $RUNNER_TEMP/luals/bin/lua-language-server --check . --checklevel=Warning --logpath "$RUNNER_TEMP/luals-log"

  test:
    name: test (nvim ${{ matrix.nvim }} on ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.11.4, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install jupytext + bridge deps
        run: uv sync --project python --locked --extra dev --python 3.12

      - name: Cache mini.test
        id: mini-test
        uses: actions/cache@v6
        with:
          path: .testdeps/mini.test
          key: mini-test-${{ env.MINI_TEST_SHA }}

      - name: Fetch mini.test
        if: steps.mini-test.outputs.cache-hit != 'true'
        run: |
          mkdir -p .testdeps
          git init .testdeps/mini.test
          git -C .testdeps/mini.test fetch --depth 1 https://github.com/nvim-mini/mini.test ${{ env.MINI_TEST_SHA }}
          git -C .testdeps/mini.test checkout --detach FETCH_HEAD

      - name: Run tests
        run: uv run --project python --locked --extra dev bash scripts/run_tests.sh

  python-quality:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --project python --locked --extra dev ruff check python
      - run: uv run --project python --locked --extra dev ruff format --check python

  bridge:
    name: bridge (pytest, py${{ matrix.python }} on ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install bridge with dev extras
        working-directory: python
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python }}
          uv run --locked --extra dev python -m ipykernel --version

      - name: Ensure python3 kernelspec is registered
        working-directory: python
        run: uv run --locked --extra dev python -m ipykernel install --user --name python3 --display-name "Python 3 (ipykernel)"

      - name: Run bridge conformance tests
        working-directory: python
        run: uv run --locked --extra dev python -m pytest -q
