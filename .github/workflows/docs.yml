name: Docs

on:
  push:
    branches: [main]
    paths: [README.md]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  vimdoc:
    name: Generate vimdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag pushes check out a detached HEAD, which git-auto-commit-action
          # cannot commit from; always build docs from the main branch.
          ref: main

      - name: Generate doc/jove.txt from README.md
        uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: jove
          description: Native .ipynb editing for Neovim via jupytext
          pandoc: README.md

      - name: Commit generated vimdoc
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: generate doc/jove.txt via panvimdoc"
          file_pattern: doc/jove.txt
