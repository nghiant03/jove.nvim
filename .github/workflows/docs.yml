name: Docs

on:
  push:
    branches: [main]
    paths: [README.md]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  vimdoc:
    name: Generate vimdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate doc/jove.txt from README.md
        uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: jove
          description: Native .ipynb editing for Neovim via jupytext
          pandoc: README.md

      - name: Commit generated vimdoc
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: generate doc/jove.txt via panvimdoc"
          file_pattern: doc/jove.txt

      - name: Run CI on the generated commit
        if: steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
