name: Docs

on:
  push:
    branches: [main]
    paths: [README.md]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  vimdoc:
    name: Generate vimdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate doc/jove.txt from README.md
        uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: jove
          description: Native .ipynb editing for Neovim via jupytext
          pandoc: README.md

      - name: Commit generated vimdoc
        id: autocommit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- doc/jove.txt; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha=$(git rev-parse HEAD:doc/jove.txt)
          content=$(base64 -w 0 doc/jove.txt)

          jq -n \
            --arg message "docs: generate doc/jove.txt via panvimdoc" \
            --arg content "$content" \
            --arg sha "$sha" \
            '{message: $message, content: $content, sha: $sha, branch: "main"}' |
            gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/doc/jove.txt" \
              --input -

          echo "changes_detected=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the generated commit
        if: steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
